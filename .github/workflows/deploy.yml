name: Deploy to GCP VM

on:
  # Trigger deployment after test suite completes successfully
  workflow_run:
    workflows: ["Test Suite"]
    types:
      - completed
    branches:
      - main
      - master
  # Allow manual deployment trigger
  workflow_dispatch:

jobs:
  deploy:
    # Only deploy if:
    # 1. Tests passed (workflow_run) - must be on main/master branch, OR
    # 2. Manual workflow dispatch
    # Note: The branch filter in workflow_run trigger ensures we only deploy from main/master
    if: |
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || 
        github.event.workflow_run.head_branch == 'master')) ||
      github.event_name == 'workflow_dispatch'
    
    runs-on: ubuntu-latest
    
    steps:
      # Use the same commit that triggered the test workflow
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # For workflow_run: use the commit SHA from the test workflow
          # For push/manual dispatch: use current commit SHA
          # Note: 'ref' accepts both branch names and commit SHAs
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      
      - name: Detect wake-proxy changes
        id: wake_proxy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(wake-proxy/|deploy-wake-proxy\.sh)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: photogroup-215600

      # The VM has moved zones (it is us-central1-a now, not asia-east2-a).
      # Look it up by name so a later move does not 404 the deploy.
      - name: Ensure VM is running
        id: vm
        run: |
          PROJECT=photogroup-215600
          INSTANCE=main
          ZONE_URL=$(gcloud compute instances list \
            --project "$PROJECT" \
            --filter="name=${INSTANCE}" \
            --format='value(zone)' | head -n 1)
          if [ -z "$ZONE_URL" ]; then
            echo "ERROR: VM '$INSTANCE' was not found in project $PROJECT"
            exit 1
          fi
          ZONE="${ZONE_URL##*/}"
          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"
          echo "VM $INSTANCE is in $ZONE"
          STATUS=$(gcloud compute instances describe "$INSTANCE" \
            --project "$PROJECT" --zone "$ZONE" \
            --format='get(status)')
          echo "VM status: $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Starting VM for deployment..."
            gcloud compute instances start "$INSTANCE" \
              --project "$PROJECT" --zone "$ZONE"
            for i in $(seq 1 30); do
              if gcloud compute ssh "$INSTANCE" --project "$PROJECT" --zone "$ZONE" \
                --command "true" 2>/dev/null; then
                echo "VM is reachable"
                break
              fi
              echo "Waiting for VM... ($i)"
              sleep 10
            done
          fi
          # The VM's idle-stop check only sees live connections and nginx
          # traffic, so between deploy steps an idle VM looked unused and was
          # stopped mid-deploy. Record the deploy as activity (idle-stop.sh
          # reads this key) so the VM stays up for the idle window.
          gcloud compute instances add-metadata "$INSTANCE" \
            --project "$PROJECT" --zone "$ZONE" \
            --metadata "wake-last-activity-ms=$(date +%s%3N)" \
            || echo "WARNING: could not record deploy activity on the VM"
        timeout-minutes: 10
      
      - name: Deploy nginx configuration
        run: |
          chmod +x deploy-nginx.sh
          ./deploy-nginx.sh
        timeout-minutes: 5
        env:
          ZONE: ${{ steps.vm.outputs.zone }}
          INSTANCE: main
          PROJECT: photogroup-215600
      
      - name: Deploy application with Docker
        run: |
          chmod +x deploy-docker.sh
          ./deploy-docker.sh
        timeout-minutes: 15
        env:
          ZONE: ${{ steps.vm.outputs.zone }}
          INSTANCE: main
          PROJECT: photogroup-215600
          # Pass version number to Docker build for Settings view
          VITE_APP_VERSION: ${{ github.run_number }}
          # Twilio credentials are passed as env vars to the container at runtime
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}

      - name: Deploy wake proxy to Cloud Run
        if: steps.wake_proxy.outputs.changed == 'true'
        run: |
          chmod +x deploy-wake-proxy.sh wake-proxy/vm-idle-stop/install-idle-stop.sh
          ./deploy-wake-proxy.sh
        timeout-minutes: 20
        env:
          ZONE: ${{ steps.vm.outputs.zone }}
          REGION: asia-southeast1
          INSTANCE: main
          PROJECT: photogroup-215600
          IDLE_MINUTES: 60
          WAKE_STOP_SECRET: ${{ secrets.WAKE_STOP_SECRET }}
      
      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Instance: main"
          echo "Zone: ${{ steps.vm.outputs.zone }}"
          echo "Project: photogroup-215600"
          echo "Wake proxy redeployed: ${{ steps.wake_proxy.outputs.changed }}"
          echo "Deployment method: Docker + Cloud Run wake proxy"
